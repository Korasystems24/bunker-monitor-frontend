name: bunker-monitor

services:
  frontend:
    build: .
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    env_file:
      - .env
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://host.docker.internal:8000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - /app/node_modules
